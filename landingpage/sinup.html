<body>
    <div class="hero">
        <nav >
            <button type="button" class="hamburger" id="hamburger">

            <li><a href="#">Home</a></li>

 </nav  >
 <div class="registration">
   <h1>Registration Form</h1>
   <div class="registration-form">
    <form id="signupForm" >

        <div class="input-name">
            <i class="fa-solid fa-user" style="color: white; font-size: 24px;"></i>
            <div class="field">
            <input type="text" id="firstName" placeholder="First Name" class="name" required>
            <small  id="firstNameError" style="color:orangered;"></small><br>
            </div>

            <!-- <span> -->

                <i class="fa-solid fa-user" style="color: white; font-size: 24px;"></i>
                <div class="field">
                <input type="text" id="lastName" placeholder="Last Name" class="name" required><br>
                <small  id="lastNameError" style="color:orangered;"></small>
                </div>

            <!-- </span> -->
        </div>

         <div class="input-name">
            <i class="fa-solid fa-envelope" style="color:white; font-size: 24px;"></i>
            <div class="field">
            <input type="text" id="email" placeholder="Email" class="text-name" required><br>
               <small  id="emailError" ></small> 
         </div>
        </div>

         <div class="input-name">
            <i class="fa-solid fa-lock" style="color: white; font-size: 24px;"></i>
            <div class="field">
            <input type="password" id="password" placeholder="Password" class="text-name" required><br>
            <small  id="passwordError" ></small>
            </div>
        </div>

         <div class="input-name">
            <i class="fa-solid fa-lock" style="color:white; font-size: 24px;"></i>
            <div class="field">
            <input type="password" id="confirmPassword" placeholder="Conform Password" class="text-name" required>
            <small  id="confirmPasswordError" ></small>
            </div>
          
        </div>

        <div class="input-name">
            <!-- <input type="submit" class="buttoni" value="Register"> -->
             <button class="sinup secondbutton" id="register" >Register</button>
        </div>

    </form>
   </div>
</div>
